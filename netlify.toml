[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/country.json"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"
